version: "3.9"
services:
  backend:
    build: ./backend
    container_name: sahayak-backend
    environment:
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sahayak-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: sahayak-db
    environment:
      - POSTGRES_DB=triage
      - POSTGRES_USER=${DB_USER:-triage_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-triage_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: